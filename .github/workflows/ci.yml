name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run unit and smoke tests
        run: python -m unittest discover -s tests -v

      - name: bash -n all tracked shell scripts
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            bash -n "$file"
          done < <(git ls-files '*.sh')

      - name: Verify launch.sh SHA256SUMS is up to date
        run: bash scripts/check-launch-manifest.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure shellcheck is installed
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck --version | head -2
      - name: ShellCheck (self-maintained scripts; vendored snapshots excluded)
        run: >-
          shellcheck -s bash
          launch.sh run.sh
          scripts/check-launch-manifest.sh
          scripts/regen-launch-manifest.sh
          scripts/geosite/release-pack.sh
          scripts/docker-mirror-switch.sh
          scripts/dockerhub-mirror.sh
          scripts/tcp-brutal-manager.sh
          yjl-argo/yjl-argo.sh
          yjl-argo/install.sh
          tools/nft-forward/install.sh

  windows:
    # 开发平台回归：curses/geteuid 守卫、CRLF 行尾、e2e 在 Git Bash 下同样必须成立。
    # 按测试模块分步执行：runner 日志接口需要认证，步骤结论（公开）即可定位失败模块。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Prepare Git Bash tool PATH
        shell: bash
        run: echo "/usr/bin" >> "$GITHUB_PATH"
      - name: unittest tests.test_doctor
        shell: bash
        run: python -m unittest tests.test_doctor -v
      - name: DispatchTests.test_exit_kind_sets_should_exit_without_pause
        shell: bash
        run: python -m unittest tests.test_yjl_tui.DispatchTests.test_exit_kind_sets_should_exit_without_pause -v
      - name: DispatchTests.test_unknown_builtin_returns_1_with_message
        shell: bash
        run: python -m unittest tests.test_yjl_tui.DispatchTests.test_unknown_builtin_returns_1_with_message -v
      - name: DispatchTests.test_builtin_fallback_runs_interactive
        shell: bash
        run: python -m unittest tests.test_yjl_tui.DispatchTests.test_builtin_fallback_runs_interactive -v
      - name: DispatchTests.test_handler_registry_routes_and_pauses_once
        shell: bash
        run: python -m unittest tests.test_yjl_tui.DispatchTests.test_handler_registry_routes_and_pauses_once -v
      - name: DispatchTests.test_tcp_profile_routes_to_apply
        shell: bash
        run: python -m unittest tests.test_yjl_tui.DispatchTests.test_tcp_profile_routes_to_apply -v
      - name: DispatchTests.test_local_script_chains_repair_for_tcp_brutal_install
        shell: bash
        run: python -m unittest tests.test_yjl_tui.DispatchTests.test_local_script_chains_repair_for_tcp_brutal_install -v
      - name: DispatchTests.test_local_script_success_without_install_id_skips_repair
        shell: bash
        run: python -m unittest tests.test_yjl_tui.DispatchTests.test_local_script_success_without_install_id_skips_repair -v
      - name: DispatchTests.test_execute_root_gate_reports_and_pauses
        shell: bash
        run: python -m unittest tests.test_yjl_tui.DispatchTests.test_execute_root_gate_reports_and_pauses -v
      - name: DispatchTests.test_execute_cancelled_by_confirm
        shell: bash
        run: python -m unittest tests.test_yjl_tui.DispatchTests.test_execute_cancelled_by_confirm -v
      - name: unittest tests.test_yjl_tui.HelperTests
        shell: bash
        run: python -m unittest tests.test_yjl_tui.HelperTests -v
      - name: unittest tests.test_yjl_tui.EntryTests
        shell: bash
        run: python -m unittest tests.test_yjl_tui.EntryTests -v
      - name: unittest tests.test_nginx_manager
        shell: bash
        run: python -m unittest tests.test_nginx_manager -v
      - name: unittest tests.test_kernel_manager
        shell: bash
        run: python -m unittest tests.test_kernel_manager -v
      - name: unittest tests.test_singbox_manager
        shell: bash
        run: python -m unittest tests.test_singbox_manager -v
      - name: unittest tests.test_smoke.ConfigSmokeTests
        shell: bash
        run: python -m unittest tests.test_smoke.ConfigSmokeTests -v
      - name: unittest tests.test_smoke.LocalBehaviorTests
        shell: bash
        run: python -m unittest tests.test_smoke.LocalBehaviorTests -v
      - name: unittest tests.test_launch_e2e
        shell: bash
        run: python -m unittest tests.test_launch_e2e -v
