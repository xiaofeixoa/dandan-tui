name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run unit and smoke tests
        run: python -m unittest discover -s tests -v

      - name: bash -n all tracked shell scripts
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            bash -n "$file"
          done < <(git ls-files '*.sh')

      - name: Verify launch.sh SHA256SUMS is up to date
        run: bash scripts/check-launch-manifest.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure shellcheck is installed
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck --version | head -2
      - name: ShellCheck (self-maintained scripts; vendored snapshots excluded)
        run: >-
          shellcheck -s bash
          launch.sh run.sh
          scripts/check-launch-manifest.sh
          scripts/regen-launch-manifest.sh
          scripts/geosite/release-pack.sh
          scripts/docker-mirror-switch.sh
          scripts/dockerhub-mirror.sh
          scripts/tcp-brutal-manager.sh
          yjl-argo/yjl-argo.sh
          yjl-argo/install.sh
          tools/nft-forward/install.sh

  windows:
    # 开发平台回归：curses/geteuid 守卫、CRLF 行尾、e2e 在 Git Bash 下同样必须成立。
    # PYTHONUTF8：runner 默认 cp1252，无法打印测试输出的中文（真实使用路径 run.sh 已内置该设置）。
    # 按测试类分步执行：runner 日志接口需要认证，步骤结论（公开）即可定位失败模块。
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Prepare Git Bash tool PATH
        shell: bash
        run: echo "/usr/bin" >> "$GITHUB_PATH"
      - name: unittest tests.test_doctor
        shell: bash
        run: python -m unittest tests.test_doctor -v
      - name: unittest tests.test_yjl_tui.DispatchTests
        shell: bash
        run: python -m unittest tests.test_yjl_tui.DispatchTests -v
